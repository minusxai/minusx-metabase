name: Project checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out requested commit
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          gh auth setup-git
          gh repo clone "$GITHUB_REPOSITORY" . -- --depth=1
          git fetch --depth=1 origin "$CHECKOUT_SHA"
          git checkout --detach FETCH_HEAD
      - name: Install pinned Node runtime
        env:
          NODE_VERSION: '22.23.4'
        run: |
          archive="node-v${NODE_VERSION}-linux-x64.tar.xz"
          runtime_dir="$RUNNER_TEMP/project-node"
          mkdir -p "$runtime_dir"
          cd "$runtime_dir"
          curl --fail --silent --show-error --location --retry 3 "https://nodejs.org/dist/v${NODE_VERSION}/$archive" -o "$archive"
          curl --fail --silent --show-error --location --retry 3 "https://nodejs.org/dist/v${NODE_VERSION}/SHASUMS256.txt" -o SHASUMS256.txt
          awk -v archive="$archive" '$2 == archive { print; found = 1 } END { if (!found) exit 1 }' SHASUMS256.txt > archive.sha256
          sha256sum --check archive.sha256
          tar --extract --xz --file "$archive" --strip-components=1
          echo "$runtime_dir/bin" >> "$GITHUB_PATH"
      - name: Refresh npm toolchain
        run: |
          npm install --global --no-audit --no-fund npm@12.2.1
          node scripts/patch-npm.mjs
          npm cache clean --force
      - name: Install pinned Go runtime
        run: |
          runtime_dir="$RUNNER_TEMP/project-go"
          mkdir -p "$runtime_dir"
          cd "$runtime_dir"
          curl --fail --silent --show-error --location --retry 3 https://go.dev/dl/go1.27.3.linux-amd64.tar.gz -o go.tar.gz
          echo '65efbc80fdc1fa2cd2631cad5b481777a68e8725f34e89f50fc6ac714e379b40  go.tar.gz' | sha256sum --check
          tar --extract --gzip --file go.tar.gz --strip-components=1
          echo "$runtime_dir/bin" >> "$GITHUB_PATH"
          echo "GOROOT=$runtime_dir" >> "$GITHUB_ENV"
      - name: Prepare esbuild runtime
        run: |
          bash scripts/rebuild-esbuild.sh "$RUNNER_TEMP/esbuild"
          echo "ESBUILD_REBUILT_DIR=$RUNNER_TEMP/esbuild" >> "$GITHUB_ENV"
          echo "ESBUILD_BINARY_PATH=$RUNNER_TEMP/esbuild/0.28.2/esbuild" >> "$GITHUB_ENV"
      - run: corepack enable
      - run: corepack yarn install --immutable
      - run: node scripts/patch-esbuild.mjs
      - run: corepack yarn workspace web test --run
      - run: corepack yarn workspace web build
      - run: corepack yarn workspace extension build
      - name: Build notebook environment
        run: docker build --file simulator/docker/jupyter.Dockerfile --tag project-notebook-fixture simulator/src
      - name: Verify notebook execution
        run: |
          docker run --detach --name project-notebook-fixture --publish 127.0.0.1:8888:8888 --env JUPYTER_TOKEN=local-notebook-fixture project-notebook-fixture
          node simulator/test/notebook.cjs
      - name: Verify concrete notebook XML runtime
        run: docker exec -i project-notebook-fixture python - < simulator/test/expat.py
      - name: Remove notebook fixture
        if: always()
        run: |
          if docker container inspect project-notebook-fixture >/dev/null 2>&1; then
            docker rm --force project-notebook-fixture
          fi
      - name: Build web image
        run: docker build --file web/Dockerfile --build-arg GIT_COMMIT_ID="$GITHUB_SHA" --tag project-web-fixture .
      - name: Verify web image
        run: node scripts/web-runtime.cjs
      - name: Release completed image build cache
        run: docker builder prune --all --force
      - name: Record complete tested image inventories
        run: |
          mkdir -p runtime-raw
          for component in notebook web; do
            image="project-${component}-fixture"
            docker image inspect --format '{{.Id}}' "$image" > "runtime-raw/${component}-image-id.txt"
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$PWD/runtime-raw:/reports" \
              aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c \
              image --image-src docker --scanners vuln --list-all-pkgs \
              --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
              --ignore-unfixed=false --ignorefile /dev/null --exit-code 0 \
              --format json --output "/reports/${component}-scan.json" --timeout 10m \
              "$image"
          done
      - name: Bind inventories to tested images and source
        env:
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 scripts/report-runtime.py \
            --image-id runtime-raw/notebook-image-id.txt --scan runtime-raw/notebook-scan.json \
            --output runtime-reports/notebook-dependencies.json \
            --sources simulator/docker/jupyter.Dockerfile simulator/src/requirements.lock.txt simulator/src/expat-patches/SHA256SUMS simulator/src/python-bootstrap/patch-pip-wheel.py simulator/src/python-bootstrap/refresh-bootstrap.py simulator/src/python-bootstrap/check-pip-vendors.py simulator/test/expat.py simulator/test/notebook.cjs scripts/report-runtime.py
          python3 scripts/report-runtime.py \
            --image-id runtime-raw/web-image-id.txt --scan runtime-raw/web-scan.json \
            --output runtime-reports/web-dependencies.json \
            --sources web/Dockerfile yarn.lock scripts/patch-npm.mjs scripts/patch-esbuild.mjs scripts/rebuild-esbuild.sh scripts/web-runtime.cjs scripts/report-runtime.py
      - name: Upload tested runtime inventories
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tested-images-${{ github.sha }}
          path: runtime-reports/*.json
          if-no-files-found: error
          retention-days: 14
