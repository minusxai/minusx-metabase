name: Project checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.4'
      - run: corepack enable
      - run: corepack yarn install --immutable
      - run: corepack yarn workspace web test --run
      - run: corepack yarn workspace web build
      - run: corepack yarn workspace extension build
      - name: Build notebook environment
        run: docker build --file simulator/docker/jupyter.Dockerfile --tag project-notebook-fixture simulator/src
      - name: Verify notebook execution
        run: |
          docker run --detach --name project-notebook-fixture --publish 127.0.0.1:8888:8888 --env JUPYTER_TOKEN=local-notebook-fixture project-notebook-fixture
          node simulator/test/notebook.cjs
      - name: Remove notebook fixture
        if: always()
        run: |
          if docker container inspect project-notebook-fixture >/dev/null 2>&1; then
            docker rm --force project-notebook-fixture
          fi
      - name: Build web image
        run: docker build --file web/Dockerfile --build-arg GIT_COMMIT_ID="$GITHUB_SHA" --tag project-web-fixture .
      - name: Verify web image
        run: node scripts/web-runtime.cjs
